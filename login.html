<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login · Survey Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at top left, #2563eb55, transparent 35%),
        radial-gradient(circle at bottom right, #7c3aed55, transparent 35%),
        #080b14;
      color: #fff;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 26px;
      border-radius: 24px;
      background: rgba(20, 25, 40, 0.92);
      border: 1px solid rgba(255,255,255,.12);
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      box-shadow: 0 10px 30px #2563eb44;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 13px;
      border: 1px solid #30384d;
      background: #0d1220;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px #6366f122;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 18px;
    }

    .forgot {
      display: block;
      text-align: right;
      color: #818cf8;
      text-decoration: none;
      font-size: 13px;
      margin-top: -5px;
      margin-bottom: 20px;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: linear-gradient(135deg,#2563eb,#7c3aed);
      transition: .2s;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px #2563eb44;
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 14px;
    }

    .message.error {
      display: block;
      background: #ef444422;
      border: 1px solid #ef444455;
      color: #fca5a5;
    }

    .message.success {
      display: block;
      background: #22c55e22;
      border: 1px solid #22c55e55;
      color: #86efac;
    }

    .register {
      text-align: center;
      margin-top: 25px;
      color: #9ca3af;
      font-size: 14px;
    }

    .register a {
      color: #818cf8;
      text-decoration: none;
      font-weight: bold;
    }

    .demo-note {
      margin-top: 22px;
      padding: 12px;
      border-radius: 12px;
      background: #ffffff08;
      color: #9ca3af;
      font-size: 12px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="logo">📋</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
      Login to your Survey Hub account
    </p>

    <div id="message" class="message"></div>

    <form id="loginForm">

      <div class="field">
        <label for="identifier">Email or Phone Number</label>

        <input
          type="text"
          id="identifier"
          name="identifier"
          placeholder="Enter email or phone"
          autocomplete="username"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
            aria-label="Show password"
          >👁</button>
        </div>
      </div>

      <a href="#" class="forgot" id="forgotPassword">
        Forgot password?
      </a>

      <button type="submit" class="login-btn" id="loginBtn">
        Login
      </button>

    </form>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>

    <div class="demo-note">
      🔐 Your account information should be protected by the site's
      authentication system.
    </div>

  </div>

  <script>
    const form = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const message = document.getElementById("message");
    const password = document.getElementById("password");
    const showPassword = document.getElementById("showPassword");

    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }

    showPassword.addEventListener("click", () => {
      if (password.type === "password") {
        password.type = "text";
        showPassword.textContent = "🙈";
      } else {
        password.type = "password";
        showPassword.textContent = "👁";
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const identifier =
        document.getElementById("identifier").value.trim();

      const passwordValue = password.value;

      if (!identifier || !passwordValue) {
        showMessage("Please enter your login details.");
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Logging in...";
      message.className = "message";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            identifier: identifier,
            password: passwordValue
          })
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("Server returned an invalid response.");
        }

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Login failed. Please check your details."
          );
        }

        if (data.token) {
          localStorage.setItem("token", data.token);
        }

        if (data.user) {
          localStorage.setItem(
            "user",
            JSON.stringify(data.user)
          );
        }

        showMessage("Login successful. Redirecting...", "success");

        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 700);

      } catch (error) {
        console.error("Login error:", error);

        showMessage(
          error.message || "Unable to connect to the server."
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });

    document
      .getElementById("forgotPassword")
      .addEventListener("click", (e) => {
        e.preventDefault();

        showMessage(
          "Password recovery will be available soon."
        );
      });
  </script>

</body>
  </html>
