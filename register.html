<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account · Survey Hub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background:
        radial-gradient(circle at top left, #2563eb55, transparent 35%),
        radial-gradient(circle at bottom right, #7c3aed55, transparent 35%),
        #080b14;

      color: #fff;
    }

    .register-card {
      width: 100%;
      max-width: 440px;
      padding: 32px 26px;
      border-radius: 24px;

      background: rgba(20, 25, 40, .94);
      border: 1px solid rgba(255,255,255,.12);

      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 20px;
      font-size: 34px;

      background: linear-gradient(135deg, #2563eb, #7c3aed);
      box-shadow: 0 10px 30px #2563eb44;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .bonus {
      padding: 14px;
      margin-bottom: 22px;

      text-align: center;
      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #f59e0b18,
        #22c55e18
      );

      border: 1px solid #f59e0b44;
    }

    .bonus strong {
      display: block;
      color: #fbbf24;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .bonus span {
      color: #d1d5db;
      font-size: 12px;
    }

    .field {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px;

      border-radius: 13px;
      border: 1px solid #30384d;

      background: #0d1220;
      color: #fff;

      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px #6366f122;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 55px;
    }

    .show-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: none;

      color: #9ca3af;
      cursor: pointer;
      font-size: 18px;
    }

    .terms {
      display: flex;
      gap: 9px;
      align-items: flex-start;

      margin: 5px 0 20px;

      color: #9ca3af;
      font-size: 12px;
      line-height: 1.5;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms a {
      color: #818cf8;
      text-decoration: none;
    }

    .register-btn {
      width: 100%;
      padding: 15px;

      border: none;
      border-radius: 14px;

      color: white;
      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      background: linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
      );

      transition: .2s;
    }

    .register-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 25px #2563eb44;
    }

    .register-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;

      margin-bottom: 17px;
      padding: 12px;

      border-radius: 10px;

      text-align: center;
      font-size: 14px;
    }

    .message.error {
      display: block;

      color: #fca5a5;
      background: #ef444422;
      border: 1px solid #ef444455;
    }

    .message.success {
      display: block;

      color: #86efac;
      background: #22c55e22;
      border: 1px solid #22c55e55;
    }

    .login {
      text-align: center;
      margin-top: 23px;

      color: #9ca3af;
      font-size: 14px;
    }

    .login a {
      color: #818cf8;
      text-decoration: none;
      font-weight: bold;
    }

    .security {
      margin-top: 20px;
      text-align: center;

      color: #6b7280;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="register-card">

    <div class="logo">📋</div>

    <h1>Create Account</h1>

    <p class="subtitle">
      Join Survey Hub and start completing surveys
    </p>

    <div class="bonus">
      <strong>🎁 KES 450 Welcome Bonus</strong>
      <span>
        Demo/reward balance credited once after successful registration.
      </span>
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <!-- FULL NAME -->
      <div class="field">
        <label for="fullName">Full Name</label>

        <input
          type="text"
          id="fullName"
          name="fullName"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <!-- EMAIL -->
      <div class="field">
        <label for="email">Email Address</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >
      </div>

      <!-- PHONE -->
      <div class="field">
        <label for="phone">Phone Number</label>

        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="+2547XXXXXXXX"
          autocomplete="tel"
          required
        >
      </div>

      <!-- PASSWORD -->
      <div class="field">
        <label for="password">Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showPassword"
          >👁</button>

        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="field">
        <label for="confirmPassword">Confirm Password</label>

        <div class="password-wrap">

          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Repeat your password"
            autocomplete="new-password"
            minlength="6"
            required
          >

          <button
            type="button"
            class="show-password"
            id="showConfirmPassword"
          >👁</button>

        </div>
      </div>

      <!-- TERMS -->
      <label class="terms">

        <input
          type="checkbox"
          id="terms"
          required
        >

        <span>
          I agree to the
          <a href="#">Terms & Conditions</a>
          and understand that rewards are subject to the site's rules.
        </span>

      </label>

      <button
        type="submit"
        class="register-btn"
        id="registerBtn"
      >
        Create Account
      </button>

    </form>

    <div class="login">
      Already have an account?
      <a href="login.html">Login</a>
    </div>

    <div class="security">
      🔐 Never share your password with anyone.
    </div>

  </div>


  <script>
    const form = document.getElementById("registerForm");

    const registerBtn =
      document.getElementById("registerBtn");

    const message =
      document.getElementById("message");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirmPassword");


    function showMessage(text, type = "error") {
      message.textContent = text;
      message.className = "message " + type;
    }


    function togglePassword(input, button) {

      button.addEventListener("click", () => {

        if (input.type === "password") {

          input.type = "text";
          button.textContent = "🙈";

        } else {

          input.type = "password";
          button.textContent = "👁";

        }

      });

    }


    togglePassword(
      password,
      document.getElementById("showPassword")
    );


    togglePassword(
      confirmPassword,
      document.getElementById("showConfirmPassword")
    );


    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      const fullName =
        document.getElementById("fullName").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const passwordValue =
        password.value;

      const confirmPasswordValue =
        confirmPassword.value;


      /* =========================
         VALIDATION
      ========================= */

      if (
        !fullName ||
        !email ||
        !phone ||
        !passwordValue ||
        !confirmPasswordValue
      ) {

        showMessage(
          "Please complete all required fields."
        );

        return;
      }


      if (passwordValue.length < 6) {

        showMessage(
          "Password must contain at least 6 characters."
        );

        return;
      }


      if (passwordValue !== confirmPasswordValue) {

        showMessage(
          "Passwords do not match."
        );

        return;
      }


      /* =========================
         DISABLE BUTTON
      ========================= */

      registerBtn.disabled = true;
      registerBtn.textContent = "Creating Account...";

      message.className = "message";


      try {

        const response = await fetch(
          "/api/auth/register",
          {
            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({

              fullName: fullName,
              email: email,
              phone: phone,
              password: passwordValue,
              confirmPassword: confirmPasswordValue

            })
          }
        );


        let data;

        try {

          data = await response.json();

        } catch {

          throw new Error(
            "Server returned an invalid response."
          );

        }


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            "Registration failed."
          );

        }


        /* =========================
           SAVE LOGIN TOKEN
        ========================= */

        if (data.token) {

          localStorage.setItem(
            "token",
            data.token
          );

        }


        if (data.user) {

          localStorage.setItem(
            "user",
            JSON.stringify(data.user)
          );

        }


        /* =========================
           SUCCESS
        ========================= */

        showMessage(
          "🎉 Account created successfully! Welcome bonus added.",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "dashboard.html";

        }, 1000);


      } catch (error) {

        console.error(
          "Registration error:",
          error
        );

        showMessage(
          error.message ||
          "Unable to connect to the server."
        );


        registerBtn.disabled = false;
        registerBtn.textContent =
          "Create Account";

      }

    });

  </script>

</body>
</html>
