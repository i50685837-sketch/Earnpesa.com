<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      overflow-x: hidden;

      background:
        radial-gradient(circle at 15% 20%, rgba(255, 193, 7, .22), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(0, 255, 170, .15), transparent 25%),
        linear-gradient(135deg, #06140f, #0b2118 45%, #03100b);
      color: white;
    }

    /* Money-pot background */
    .money-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .coin {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      background: linear-gradient(145deg, #ffd95a, #b77a00);
      box-shadow: 0 0 25px rgba(255, 193, 7, .25);
      opacity: .18;
      animation: float 7s ease-in-out infinite;
    }

    .coin:nth-child(1) { left: 8%; top: 12%; }
    .coin:nth-child(2) { right: 10%; top: 20%; animation-delay: 1s; }
    .coin:nth-child(3) { left: 15%; bottom: 15%; animation-delay: 2s; }
    .coin:nth-child(4) { right: 17%; bottom: 10%; animation-delay: 3s; }

    .pot {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 230px;
      opacity: .035;
      filter: blur(1px);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-25px) rotate(10deg);
      }
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 430px;
    }

    .register-card {
      padding: 30px 25px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 25px;
      background: rgba(7, 24, 17, .82);
      backdrop-filter: blur(18px);
      box-shadow: 0 25px 70px rgba(0,0,0,.5);
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      background: linear-gradient(145deg, #ffd54a, #a86f00);
      box-shadow: 0 10px 35px rgba(255,193,7,.25);
    }

    h1 {
      text-align: center;
      font-size: 27px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #aebbb4;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #d9e3de;
    }

    input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 13px;
      outline: none;
      background: rgba(255,255,255,.06);
      color: white;
      font-size: 15px;
      transition: .25s;
    }

    input::placeholder {
      color: #718078;
    }

    input:focus {
      border-color: #f6c343;
      box-shadow: 0 0 0 3px rgba(246,195,67,.1);
    }

    .phone-wrap {
      display: flex;
      gap: 8px;
    }

    .country {
      width: 75px;
      text-align: center;
      color: #ffd45c;
      font-weight: bold;
    }

    .phone-wrap input {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 7px;
      border: 0;
      border-radius: 14px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #151006;
      background: linear-gradient(135deg, #ffd95a, #f1ad16);
      box-shadow: 0 10px 25px rgba(241,173,22,.18);
      transition: .2s;
    }

    button:hover {
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
      font-size: 13px;
      background: rgba(255,255,255,.06);
    }

    .login {
      text-align: center;
      margin-top: 20px;
      color: #9eaaa4;
      font-size: 14px;
    }

    .login a {
      color: #ffd45c;
      text-decoration: none;
      font-weight: bold;
    }

    .terms {
      margin-top: 15px;
      text-align: center;
      color: #75827c;
      font-size: 11px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="money-bg">
    <div class="pot">🐷</div>
    <div class="coin">KSh</div>
    <div class="coin">🪙</div>
    <div class="coin">KSh</div>
    <div class="coin">🪙</div>
  </div>

  <div class="container">
    <div class="register-card">

      <div class="logo">🐷</div>

      <h1>Create Account</h1>
      <p class="subtitle">Create your account to get started</p>

      <form id="registerForm">

        <div class="input-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="input-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
          >
        </div>

        <div class="input-group">
          <label for="phone">Phone Number</label>

          <div class="phone-wrap">
            <input
              class="country"
              type="text"
              value="+254"
              readonly
            >

            <input
              type="tel"
              id="phone"
              name="phone"
              placeholder="797 000 000"
              maxlength="9"
              pattern="[0-9]{9}"
              required
            >
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="6"
            required
          >
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Repeat your password"
            minlength="6"
            required
          >
        </div>

        <button type="submit" id="registerBtn">
          Create Account
        </button>

        <div class="message" id="message"></div>

      </form>

      <div class="login">
        Already have an account?
        <a href="/login.html">Log in</a>
      </div>

      <div class="terms">
        By creating an account, you agree to use this application
        responsibly and in accordance with its terms.
      </div>

    </div>
  </div>

  <script>
    const form = document.getElementById("registerForm");
    const message = document.getElementById("message");
    const button = document.getElementById("registerBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phoneInput = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showMessage("Passwords do not match.");
        return;
      }

      if (!/^[0-9]{9}$/.test(phoneInput)) {
        showMessage("Enter a valid Kenyan phone number.");
        return;
      }

      const phone = "+254" + phoneInput;

      button.disabled = true;
      button.textContent = "Creating Account...";

      try {
        const response = await fetch("/api/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            email,
            phone,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(
            data.message ||
            data.error ||
            "Registration failed."
          );
        }

        showMessage(
          data.message || "Account created successfully."
        );

        setTimeout(() => {
          window.location.href = "/login.html";
        }, 1200);

      } catch (error) {
        showMessage(error.message);
      } finally {
        button.disabled = false;
        button.textContent = "Create Account";
      }
    });

    function showMessage(text) {
      message.style.display = "block";
      message.textContent = text;
    }
  </script>

</body>
                        </html>
